<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D&D Artefact Roller</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="container">
    <h1>D&D Artefact Roller</h1>

    <section class="inputs">
      <div class="grid">

        <label>
          Minor Beneficial
          <input id="minorBen" type="number" min="0" value="2">
        </label>

        <label>
          Major Beneficial
          <input id="majorBen" type="number" min="0" value="1">
        </label>

        <label>
          Minor Detrimental
          <input id="minorDet" type="number" min="0" value="1">
        </label>

        <label>
          Major Detrimental
          <input id="majorDet" type="number" min="0" value="0">
        </label>
      </div>
      
      <br>

      <button id="rollBtn">Roll Artefact</button>

      <div id="out"></div>

    </section>
  </main>

  <script src="app.js"></script>

</body>
</html>
